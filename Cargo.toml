[package]
name = "burgentruck-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
minstant = { version = "0.1.7", features = ["coarsetime"] }
pgn-reader = "0.29.1"
rand = "0.9.2"
shakmaty = { version = "0.30.2", features = ["nohash-hasher", "variant"] }
shakmaty-syzygy = "0.28.1"

[build-dependencies]
cc = "1.0"
bindgen = "0.73"

[profile.dev]
opt-level = 2

[profile.release]
debug = true
codegen-units = 1
lto = true
